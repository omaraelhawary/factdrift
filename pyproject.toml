[project]
name = "factdrift"
version = "0.1.0"
description = "Detect corpus-level contradictions and measure which version retrieval serves."
requires-python = ">=3.12"
dependencies = ["anthropic>=0.75"]

[project.scripts]
factdrift = "factdrift.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
